<div class="app"><header><h1>🚀 單字星球</h1><div class="topright"><div id="userBox"><span>👤 IAN</span><button id="logout">切換身分</button></div><select id="lesson" aria-label="選擇課次"></select></div></header>

<script>
const DEFAULT_LESSONS=[
{title:'第 1 課',words:[{en:'one',zh:'一'},{en:'meet',zh:'認識；相遇'},{en:'class',zh:'班級'},{en:'here',zh:'這裡'},{en:'red',zh:'紅色'},{en:'pen',zh:'筆'},{en:'English',zh:'英語'},{en:'teacher',zh:'老師'}]},
{title:'第 2 課',words:[{en:'two',zh:'二'},{en:'blue',zh:'藍色'},{en:'book',zh:'書'},{en:'green',zh:'綠色'},{en:'pink',zh:'粉紅色'},{en:'purple',zh:'紫色'},{en:'pencil',zh:'鉛筆'},{variants:[{en:'Miss',zh:'小姐（稱謂）'},{en:'miss',zh:'想念'}]}]},
{title:'第 3 課',words:[{en:'three',zh:'三'},{en:'cap',zh:'棒球帽'},{en:'come',zh:'來'},{en:'his',zh:'他的'},{en:'please',zh:'請'},{en:'yes',zh:'是的'},{en:'this',zh:'這'},{en:'whose',zh:'誰的'}]}
];
const WORD_IMAGES={one:'1️⃣',two:'2️⃣',three:'3️⃣',red:'🔴',blue:'🔵',green:'🟢',pink:'🩷',purple:'🟣',pen:'🖊️',pencil:'✏️',book:'📖',cap:'🧢',teacher:'👩‍🏫',class:'🏫',English:'🔤'};
const MODE_NAMES={listen:['👂','聽音辨字'],tiles:['🧩','字母排列'],missing:['🔎','消失的字母'],picture:['🖼️','看圖拼字'],dictation:['✏️','終極默寫'],review:['💪','錯題複習']};
const STAGES=['listen','tiles','missing','picture','dictation','review'];
const $=id=>document.getElementById(id);
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const load=(k,def)=>{try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def}};
let lessons=load('ian-lessons-v3',DEFAULT_LESSONS),history=load('ian-progress-v3',{}),misses=load('ian-misses-v3',{}),stageUnlock=load('ian-unlock-v3',{}),attempts=load('ian-attempts-v3',{}),lesson=0,mode='listen',idx=0,queue=[],selected=[],used=[],pending=false,checked=false,voiceSeq=0,points=0,tiles=[],hiddenPositions=[],wordError=false,selectedMode='listen',editPosition=null,screen='login',audioEnabled=false;
const words=()=>lessons[lesson].words.flatMap(w=>w.variants||[w]);
const key=w=>lesson+'|'+w.en;
const stageKey=(m=mode,l=lesson)=>l+'|'+m;
const isUnlocked=m=>STAGES.indexOf(m)<=Number(stageUnlock[lesson]||0);
const randomize=a=>{let arr=a.slice();for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr};
const eligible=()=>{let a=words();return mode==='picture'?a.filter(w=>WORD_IMAGES[w.en]):mode==='review'?(a.filter(w=>misses[key(w)]) .length?a.filter(w=>misses[key(w)]):a):a};
const current=()=>queue[idx]||null;
function makeQueue(){let last=current()?.en;queue=randomize(eligible());if(queue.length>1&&queue[0].en===last)queue.push(queue.shift());idx=0}
function lock(v){document.querySelectorAll('.tile,.option').forEach(b=>{b.disabled=v||checked||(b.dataset.used==='yes')});$('check').disabled=v||checked;$('clear').disabled=v||checked}
function speak(){const w=current();if(!w)return;const token=++voiceSeq;pending=true;lock(true);$('playline').textContent='🔊 請先聽發音…';let completed=false;function done(){if(completed||token!==voiceSeq)return;completed=true;pending=false;lock(false);$('playline').textContent='🎯 現在可以作答了！'}if(!window.speechSynthesis){done();$('playline').textContent='🔇 裝置不支援語音';return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.en);u.lang='en-US';u.rate=.76;u.onend=done;u.onerror=done;speechSynthesis.speak(u);setTimeout(done,3500)}catch(e){done()}}
function stateFor(w,m=mode){const s=stageKey(m)+'|'+w.en;return history[s]||{good:0,bad:0}}
function countMastered(m=mode){const a=m==='picture'?words().filter(w=>WORD_IMAGES[w.en]):words();return a.length?{good:a.filter(w=>stateFor(w,m).good>=2).length,total:a.length}:{good:0,total:0}}
let newlyUnlocked=null,transitionTimer=null,transitionBusy=false;
function evaluateUnlock(){const i=STAGES.indexOf(mode);if(i>=5)return;let c=countMastered(mode);if(c.total&&c.good===c.total&&Number(stageUnlock[lesson]||0)<=i){stageUnlock[lesson]=i+1;save('ian-unlock-v3',stageUnlock);newlyUnlocked=STAGES[i+1]}}
function record(ok){const w=current();const id=stageKey()+'|'+w.en;const s=history[id]||{good:0,bad:0};if(ok){s.good++;if(mode==='review')delete misses[key(w)]}else{s.bad++;s.good=0;misses[key(w)]=true}history[id]=s;save('ian-progress-v3',history);save('ian-misses-v3',misses);if(ok)evaluateUnlock()}
function progressText(){let c=countMastered();return '熟練 '+c.good+' / '+c.total+'（每字連續答對 2 次）'}
function showModeButtons(){document.querySelectorAll('[data-mode]').forEach(b=>{let m=b.dataset.mode,locked=!isUnlocked(m);b.classList.toggle('active',m===mode);b.disabled=locked;b.title=locked?'先通過上一關所有單字：各連續答對兩次':'';b.style.opacity=locked?'.42':'1'})}
function generateOptions(target){const all=words().filter(w=>w.en!==target.en);const options=randomize([target.en,...randomize(all).slice(0,3).map(w=>w.en)]);$('answers').replaceChildren();options.forEach(v=>{let b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>{if(pending||checked)return;selected=[v];check()};$('answers').append(b)})}
function slots(t,display=[]){$('slots').replaceChildren();[...t].forEach((l,i)=>{const s=document.createElement('div');s.className='slot';s.textContent=display[i]||'';$('slots').append(s)})}
function shuffleDifferent(a){const original=a.join('');if(new Set(a).size<2)return a.slice();for(let i=0;i<30;i++){const candidate=randomize(a);if(candidate.join('')!==original)return candidate}const first=a.findIndex(ch=>ch!==a[0]);const rotated=a.slice(first).concat(a.slice(0,first));return rotated.join('')===original?a.slice().reverse():rotated}
function missingPositions(word,count){const chars=[...word],positions=chars.map((_,i)=>i);let result=[];for(let i=0;i<50;i++){const p=randomize(positions).slice(0,count).sort((a,b)=>a-b);result=p;if(new Set(p.map(index=>chars[index])).size>1)break}if(new Set(result.map(i=>chars[i])).size<2&&new Set(chars).size>1){const a=positions.find(i=>chars[i]!==chars[0]);result=[0,a,...positions.filter(i=>i!==0&&i!==a)].slice(0,count).sort((x,y)=>x-y)}return result}
function letterButtons(a,callback,forceDifferent=false){$('tiles').replaceChildren();const arranged=forceDifferent?shuffleDifferent(a):randomize(a);tiles=arranged.map((ch,i)=>({ch,i}));tiles.forEach((x,i)=>{let b=document.createElement('button');b.className='tile';b.textContent=x.ch;b.onclick=()=>{if(pending||checked||used.includes(i))return;used.push(i);selected.push(x.ch);b.dataset.used='yes';b.disabled=true;callback()};$('tiles').append(b)})}
function render(){clearTimeout(transitionTimer);transitionBusy=false;voiceSeq++;if(window.speechSynthesis)speechSynthesis.cancel();pending=false;checked=false;selected=[];used=[];wordError=false;
for(const id of ['cue','slots','tiles','answers','feedback'])$(id).replaceChildren();$('cue').classList.remove('emoji');$('entry').classList.add('hidden');$('entry').value='';$('feedback').className='feedback';$('next').disabled=true;$('check').classList.remove('hidden');$('clear').classList.toggle('hidden',mode==='listen');$('check').classList.toggle('hidden',mode==='listen');
let w=current(),n=queue.length;showModeButtons();$('counter').textContent=n?'第 '+(idx+1)+' / '+n+' 題':'本課完成';$('bar').style.width=n?(100*(idx+1)/n)+'%':'100%';$('points').textContent='⭐ '+points;$('heading').textContent=MODE_NAMES[mode].join(' ');$('mascot').textContent=['🦊','🐼','🐧','🐱','🐨','🦁'][idx%6];$('hint').textContent=progressText();$('speak').disabled=!w;
if(!w){$('cue').textContent='🏆';$('playline').textContent='恭喜完成！';$('next').disabled=true;return}
if(mode==='listen'){$('cue').textContent='❓';generateOptions(w);$('hint').textContent='聽完發音，選出正確的單字｜'+progressText()}
if(mode==='tiles'){$('cue').textContent=w.zh;slots(w.en);letterButtons([...w.en],()=>slots(w.en,selected))}
if(mode==='missing'){let n=Math.min(w.en.length-1,Math.max(2,2+Math.floor((attempts[stageKey()]||0)/8)));hiddenPositions=missingPositions(w.en,n);$('cue').textContent=w.zh;let reveal=[...w.en];hiddenPositions.forEach(i=>reveal[i]='＿');slots(w.en,reveal);letterButtons(hiddenPositions.map(i=>w.en[i]),()=>{let r=[...w.en];hiddenPositions.forEach((i,j)=>r[i]=selected[j]||'＿');slots(w.en,r)},true)}
if(mode==='picture'){$('cue').textContent=WORD_IMAGES[w.en]||'🖼️';$('cue').classList.add('emoji');slots(w.en);letterButtons([...w.en],()=>slots(w.en,selected))}
if(mode==='dictation'||mode==='review'){$('cue').textContent=w.zh;$('entry').classList.remove('hidden')}
$('playline').textContent='🔊 準備發音';setTimeout(()=>{if(w===current()&&screen==='learner')speak()},130)}
let feedbackTimer=null;
function removeResult(){clearTimeout(feedbackTimer);const e=document.getElementById('resultOverlay');if(e)e.remove()}
function makeOverlay(className){removeResult();const e=document.createElement('div');e.id='resultOverlay';e.className='resultOverlay '+className;document.body.append(e);return e}
function speakFeedback(message){if(!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(message);u.lang='zh-TW';u.rate=.86;u.pitch=1.08;let v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase()==='zh-tw');if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function showAnswer(w){
 const overlay=makeOverlay('answerReveal');const card=document.createElement('div');card.className='answerCard';
 const symbol=document.createElement('div');symbol.textContent='💡';
 const heading=document.createElement('div');heading.className='answerHeading';heading.textContent='正確拼字';
 const word=document.createElement('div');word.className='answerWord typingWord';word.setAttribute('aria-label',w.en);
 const meaning=document.createElement('div');meaning.className='answerMeaning';meaning.textContent=w.zh;
 const button=document.createElement('button');button.className='action';button.textContent='我記住了 ➜ 下一題';button.disabled=true;
 button.onclick=()=>{removeResult();transitionBusy=false;next()};
 card.append(symbol,heading,word,meaning,button);overlay.append(card);
 const letters=[...w.en];letters.forEach((letter,i)=>{let span=document.createElement('span');span.className='typedLetter';span.textContent=letter;span.style.animationDelay=(i*.34)+'s';word.append(span)});
 feedbackTimer=setTimeout(()=>{button.disabled=false;button.focus()},letters.length*340+430);
}
function showStageUnlock(){const nextMode=newlyUnlocked;newlyUnlocked=null;const overlay=makeOverlay('celebration');const confetti=document.createElement('div');confetti.className='confetti';for(let i=0;i<42;i++){const bit=document.createElement('i');bit.style.left=(i*41%100)+'%';bit.style.animationDelay=(i%13*.11)+'s';bit.style.background=['#ffce42','#ff759c','#68cbd0','#9a78ee','#65c88b'][i%5];confetti.append(bit)}const card=document.createElement('div');card.className='answerCard unlockCard';const label=document.createElement('div');label.style.fontSize='56px';label.textContent='🎉🏆🎊';const heading=document.createElement('h2');heading.textContent='恭喜！解鎖新關卡！';const sub=document.createElement('p');sub.textContent=MODE_NAMES[nextMode][0]+' '+MODE_NAMES[nextMode][1];const buttons=document.createElement('div');buttons.className='actions';const again=document.createElement('button');again.className='action light';again.textContent='繼續練習';again.onclick=()=>{removeResult();transitionBusy=false;next()};const onward=document.createElement('button');onward.className='action';onward.textContent='進入下一階段 ➜';onward.onclick=()=>{removeResult();transitionBusy=false;pickMode(nextMode)};buttons.append(again,onward);card.append(label,heading,sub,buttons);overlay.append(confetti,card);speakFeedback('恭喜！解鎖下一關！')}
function announceResult(ok,w){
 transitionBusy=true;
 if(ok){
   removeResult();speakFeedback('正確');
   transitionTimer=setTimeout(()=>{if(newlyUnlocked){showStageUnlock()}else{transitionBusy=false;next()}},1150);
 }else{
   const overlay=makeOverlay('error');const stamp=document.createElement('div');stamp.className='resultStamp wrong';stamp.textContent='❌ 答錯了';overlay.append(stamp);
   speakFeedback('答錯了，再加油！');
   transitionTimer=setTimeout(()=>{removeResult();showAnswer(w)},1500);
 }
}
function check(){let w=current();if(!w||checked||pending||transitionBusy)return;
let ans=mode==='dictation'||mode==='review'?$('entry').value.trim():mode==='missing'?(()=>{let letters=[...w.en];hiddenPositions.forEach((position,i)=>{letters[position]=selected[i]||''});return letters.join('')})():selected.join('');
const ok=ans===w.en;checked=true;attempts[stageKey()]=(attempts[stageKey()]||0)+1;save('ian-attempts-v3',attempts);record(ok);$('feedback').textContent='';$('next').disabled=true;lock(true);showModeButtons();announceResult(ok,w)}
function next(){if(!checked||transitionBusy)return;if(idx<queue.length-1){idx++}else{makeQueue()}render()}
function pickMode(m){if(transitionBusy||!isUnlocked(m))return;mode=m;makeQueue();render()}
function editLessonSelect(){let el=$('editLesson');el.innerHTML='';lessons.forEach((l,i)=>{let op=document.createElement('option');op.value=i;op.textContent=l.title;el.append(op)});drawAdminList()}
function drawAdminList(){let li=Number($('editLesson').value||0),list=lessons[li]?.words||[];$('adminList').replaceChildren();list.forEach((group,i)=>{(group.variants||[group]).forEach((w,j)=>{let row=document.createElement('div');row.className='adminRow';let en=document.createElement('b'),zh=document.createElement('span');en.textContent=w.en;zh.textContent=w.zh;let edit=document.createElement('button'),del=document.createElement('button');edit.textContent='✏️ 修改';del.textContent='🗑️ 刪除';edit.onclick=()=>{editPosition={li,i,j};$('editEnglish').value=w.en;$('editChinese').value=w.zh};del.onclick=()=>{if(!confirm('確定刪除 '+w.en+'？'))return;if(group.variants){group.variants.splice(j,1);if(group.variants.length===1)list[i]=group.variants[0];else if(!group.variants.length)list.splice(i,1)}else list.splice(i,1);save('ian-lessons-v3',lessons);drawAdminList()};row.append(en,zh,edit,del);$('adminList').append(row)})})}
function admin(){screen='admin';$('authGate').hidden=true;$('adminScreen').hidden=false;$('gate').classList.add('hidden');editLessonSelect()}
function learner(){screen='learner';$('authGate').hidden=true;$('adminScreen').hidden=true;$('gate').classList.remove('hidden');mode=STAGES[Math.min(5,Number(stageUnlock[lesson]||0))];makeQueue();showModeButtons()}
function logout(){clearTimeout(transitionTimer);removeResult();transitionBusy=false;screen='login';voiceSeq++;if(window.speechSynthesis)speechSynthesis.cancel();$('authGate').hidden=false;$('adminScreen').hidden=true;$('gate').classList.add('hidden');$('passwordBox').hidden=true;$('authPassword').value='';$('authMessage').textContent=''}
const hash=async str=>{const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(bytes)].map(n=>n.toString(16).padStart(2,'0')).join('')};
$('ianLogin').onclick=learner;$('adminLogin').onclick=()=>{$('passwordBox').hidden=false;$('passwordPrompt').textContent=localStorage.getItem('ian-admin-hash-v3')?'請輸入管理密碼':'第一次使用：請設定至少 8 個字元的管理密碼';$('authPassword').focus()};$('authBack').onclick=()=>{$('passwordBox').hidden=true};
$('authSubmit').onclick=async()=>{let pwd=$('authPassword').value;if(!pwd)return;let hashed=await hash(pwd),existing=localStorage.getItem('ian-admin-hash-v3');if(!existing){if(pwd.length<8){$('authMessage').textContent='密碼至少需要 8 個字元';return}localStorage.setItem('ian-admin-hash-v3',hashed);admin()}else if(existing===hashed){admin()}else{$('authMessage').textContent='密碼不正確'}};
$('logout').onclick=logout;$('adminLogout').onclick=logout;$('start').onclick=()=>{$('gate').classList.add('hidden');render()};
$('lesson').innerHTML=lessons.map((l,i)=>'<option value="'+i+'">'+l.title+'</option>').join('');$('lesson').onchange=e=>{lesson=Number(e.target.value);mode=STAGES[Math.min(5,Number(stageUnlock[lesson]||0))];makeQueue();render()};
$('modes').onclick=e=>{let b=e.target.closest('[data-mode]');if(b)pickMode(b.dataset.mode)};$('speak').onclick=()=>speak();$('check').onclick=check;$('next').onclick=next;$('clear').onclick=()=>{if(pending||checked)return;selected=[];used=[];$('entry').value='';$('feedback').textContent='';render()};$('entry').onkeydown=e=>{if(e.key==='Enter')check()};
$('editLesson').onchange=()=>{editPosition=null;drawAdminList()};$('saveWord').onclick=()=>{let li=Number($('editLesson').value),en=$('editEnglish').value.trim(),zh=$('editChinese').value.trim();if(!en||!zh){alert('請填寫英文與中文');return}if(!/^[a-zA-Z]+(?:[-'][a-zA-Z]+)*$/.test(en)){alert('英文欄位只接受英文字母、連字號及撇號');return}if(editPosition){let p=editPosition,g=lessons[p.li].words[p.i];if(g.variants)g.variants[p.j]={en,zh};else lessons[p.li].words[p.i]={en,zh}}else{lessons[li].words.push({en,zh})}save('ian-lessons-v3',lessons);editPosition=null;$('editEnglish').value='';$('editChinese').value='';drawAdminList();$('lesson').innerHTML=lessons.map((l,i)=>'<option value="'+i+'">'+l.title+'</option>').join('')};
$('cancelEdit').onclick=()=>{editPosition=null;$('editEnglish').value='';$('editChinese').value=''};
$('addLesson').onclick=()=>{let title=prompt('新課名稱','第 '+(lessons.length+1)+' 課');if(!title)return;lessons.push({title,words:[]});save('ian-lessons-v3',lessons);editLessonSelect();$('editLesson').value=String(lessons.length-1);drawAdminList();$('lesson').innerHTML=lessons.map((l,i)=>'<option value="'+i+'">'+l.title+'</option>').join('')};
$('exportData').onclick=()=>{const payload={version:3,lessons,history,misses,stageUnlock,attempts};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='ian-spelling-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};
$('importData').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.lessons)||!d.lessons.every(l=>Array.isArray(l.words)))throw Error('資料格式不正確');if(!confirm('匯入會覆蓋目前本機資料，確定嗎？'))return;lessons=d.lessons;history=d.history||{};misses=d.misses||{};stageUnlock=d.stageUnlock||{};attempts=d.attempts||{};save('ian-lessons-v3',lessons);save('ian-progress-v3',history);save('ian-misses-v3',misses);save('ian-unlock-v3',stageUnlock);save('ian-attempts-v3',attempts);editLessonSelect();alert('匯入完成')}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''};
makeQueue();
</script></body></html>

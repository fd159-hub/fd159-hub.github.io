<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5d6"><title>單字星球・拼字冒險</title><style>
:root{font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#26365a;background:#fff5d6}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button{border:0;cursor:pointer;font-weight:850;touch-action:manipulation}button:disabled{opacity:.42;cursor:default}.app{min-height:100dvh;height:100dvh;display:flex;flex-direction:column;padding:clamp(8px,1.5vh,18px);gap:10px;max-width:1250px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(20px,2.7vw,32px);margin:0;color:#7449b9;white-space:nowrap}.topright{display:flex;gap:8px;align-items:center}select{background:#fff;border:3px solid #e4d5ff;border-radius:16px;padding:9px;font-weight:750;color:#55417b;min-height:44px}.speaker{background:#fff0bb;color:#865307;border:3px solid #ffd46a;border-radius:18px;padding:10px 16px;min-height:46px}.modes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.mode{background:#fff;border:3px solid #e5dff4;border-radius:18px;min-height:64px;padding:8px 4px;color:#504a7d;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:clamp(12px,1.45vw,17px);gap:1px}.mode b{font-size:clamp(21px,2.6vw,29px)}.mode.active{background:#8155df;border-color:#6535c8;color:#fff;box-shadow:0 5px 0 #d4c0ff}.game{flex:1;min-height:0;background:#fff;border-radius:30px;border:4px solid #ebdcff;box-shadow:0 8px 0 #dfc6fe;display:flex;flex-direction:column;padding:clamp(10px,2vh,22px);gap:clamp(7px,1.5vh,15px);align-items:center;justify-content:space-around}.status{align-self:stretch;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#76649e;font-weight:800;font-size:clamp(13px,1.8vw,18px)}.progress{height:11px;border-radius:50px;background:#eee7fd;flex:1;overflow:hidden}.bar{height:100%;background:#ffb933;width:0;transition:width .2s}.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}.mascot{font-size:clamp(30px,6vh,65px);line-height:1}.title{font-size:clamp(18px,3vw,31px);font-weight:950;color:#4e368b}.cue{font-size:clamp(24px,4.3vw,48px);font-weight:950;color:#173e77;text-align:center}.cue.emoji{font-size:clamp(50px,11vh,100px);line-height:1}.hint{color:#6b6c8e;font-size:clamp(13px,1.7vw,18px);text-align:center;font-weight:650}.playline{border-radius:15px;background:#eff7ff;color:#36679c;padding:7px 14px;font-size:14px;font-weight:800}.slots,.tiles,.answers{display:flex;gap:clamp(5px,1vw,12px);justify-content:center;align-items:center;flex-wrap:wrap;width:100%}.slot{min-width:clamp(36px,5vw,63px);height:clamp(47px,7vh,68px);padding:0 5px;background:#f5f1ff;border-bottom:5px solid #b89aef;border-radius:10px;font-size:clamp(25px,4vw,40px);font-weight:950;display:grid;place-items:center;color:#764dd1}.tile{min-width:clamp(42px,6vw,68px);min-height:clamp(47px,7vh,70px);padding:4px 12px;border-radius:15px;background:#ffdd73;color:#61420b;box-shadow:0 4px 0 #ebba3e;font-size:clamp(24px,3.6vw,37px)}.option{background:#e5f4ff;color:#205c91;border:3px solid #bce3ff;border-radius:18px;font-size:clamp(20px,3.5vw,34px);min-width:clamp(110px,19vw,190px);padding:14px}.entry{width:min(500px,90%);height:clamp(60px,9vh,85px);text-align:center;border:4px solid #c7b4fa;border-radius:20px;font-size:clamp(25px,4vw,39px);letter-spacing:2px;font-weight:900;color:#4e368b;outline-color:#ffb933}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.action{border-radius:17px;padding:11px 22px;min-height:50px;background:#8052da;color:white;font-size:clamp(16px,2vw,21px);box-shadow:0 4px 0 #5c34ae}.action.light{background:#e8e1ff;color:#58389b;box-shadow:0 4px 0 #c9bbf5}.feedback{min-height:30px;font-size:clamp(17px,2.4vw,23px);font-weight:900;text-align:center}.good{color:#159365}.bad{color:#df5b59}.hidden{display:none!important}footer{text-align:center;color:#827397;font-size:12px;font-weight:650}.gate{position:fixed;inset:0;z-index:9;background:#5236a4ef;display:flex;align-items:center;justify-content:center;padding:20px}.gatecard{background:white;border-radius:35px;padding:35px 24px;text-align:center;max-width:520px;width:100%;box-shadow:0 12px 0 #372479}.gatecard h2{font-size:clamp(25px,5vw,39px);color:#663bbf}.gatecard p{font-size:18px;line-height:1.6}.gatecard button{background:#ffcc51;color:#56390b;border-radius:20px;font-size:24px;padding:17px 24px;width:100%;box-shadow:0 5px 0 #d9a42c}@media(max-width:720px){.app{gap:7px}.modes{grid-template-columns:repeat(3,1fr);gap:5px}.mode{min-height:48px;flex-direction:row;gap:6px}.mode b{font-size:20px}.game{border-radius:20px;padding:8px;gap:5px}.mascot{font-size:30px}.title{font-size:18px}h1{font-size:18px}.topright{gap:4px}.speaker{padding:5px 8px;font-size:13px}select{padding:5px;font-size:13px}.action{padding:7px 15px;min-height:41px}.cue{font-size:28px}.slot{height:44px;min-width:32px}.tile{min-height:43px;min-width:35px}.hint{font-size:12px}}@media(max-height:660px){.mascot{display:none}.game{gap:2px}.mode{min-height:41px}.cue.emoji{font-size:45px}.tile{min-height:37px}.slot{height:37px}.entry{height:46px}.hero{gap:1px}.hint{font-size:12px}.action{min-height:36px}} 
</style></head><body>
<div class="gate" id="gate"><div class="gatecard"><div style="font-size:70px">🚀🌟</div><h2>單字星球・拼字冒險</h2><p>每一題都會先唸英文，聽完再開始挑戰！<br>點一下開始，開啟語音魔法 🎧</p><button id="start">🎮 開始冒險！</button></div></div>
<div class="app"><header><h1>🚀 單字星球</h1><div class="topright"><select id="lesson" aria-label="選擇課次"></select><button class="speaker" id="speak">🔊 再聽一次</button></div></header>
<nav class="modes" id="modes"><button class="mode active" data-mode="listen"><b>👂</b>聽音辨字</button><button class="mode" data-mode="tiles"><b>🧩</b>字母排列</button><button class="mode" data-mode="missing"><b>🔎</b>消失字母</button><button class="mode" data-mode="picture"><b>🖼️</b>看圖拼字</button><button class="mode" data-mode="dictation"><b>✏️</b>終極默寫</button><button class="mode" data-mode="review"><b>💪</b>錯題複習</button></nav>
<section class="game"><div class="status"><span id="counter"></span><div class="progress"><div class="bar" id="bar"></div></div><span id="points">⭐ 0</span></div><div class="hero"><div class="mascot" id="mascot">🦊</div><div class="title" id="heading"></div><div class="playline" id="playline">🔊 準備發音中</div></div><div class="cue" id="cue"></div><div class="hint" id="hint"></div><div class="slots" id="slots"></div><div class="tiles" id="tiles"></div><div class="answers" id="answers"></div><input class="entry hidden" id="entry" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" aria-label="輸入英文單字" placeholder="寫出你聽到的單字"><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="action light" id="clear">↩ 重試</button><button class="action" id="check">✅ 檢查答案</button><button class="action light" id="next">➡ 下一題</button></div></section><footer>每題先聽發音｜Miss / miss 同組不同意思｜學習紀錄儲存於本裝置</footer></div>
<script>const LESSONS=[
{title:'第 1 課',words:[{en:'one',zh:'一'},{en:'meet',zh:'認識；相遇'},{en:'class',zh:'班級'},{en:'here',zh:'這裡'},{en:'red',zh:'紅色'},{en:'pen',zh:'筆'},{en:'English',zh:'英語'},{en:'teacher',zh:'老師'}]},
{title:'第 2 課',words:[{en:'two',zh:'二'},{en:'blue',zh:'藍色'},{en:'book',zh:'書'},{en:'green',zh:'綠色'},{en:'pink',zh:'粉紅色'},{en:'purple',zh:'紫色'},{en:'pencil',zh:'鉛筆'},{variants:[{en:'Miss',zh:'小姐（稱謂）'},{en:'miss',zh:'想念'}]}]},
{title:'第 3 課',words:[{en:'three',zh:'三'},{en:'cap',zh:'棒球帽'},{en:'come',zh:'來'},{en:'his',zh:'他的'},{en:'please',zh:'請'},{en:'yes',zh:'是的'},{en:'this',zh:'這'},{en:'whose',zh:'誰的'}]}
];
const IMAGE={one:'1️⃣',two:'2️⃣',three:'3️⃣',red:'🔴',blue:'🔵',green:'🟢',pink:'🩷',purple:'🟣',pen:'🖊️',pencil:'✏️',book:'📖',cap:'🧢',teacher:'👩‍🏫',class:'🏫',English:'🔤'};
const MODES={listen:['👂','聽音辨字'],tiles:['🧩','字母排列'],missing:['🔎','消失的字母'],picture:['🖼️','看圖拼字'],dictation:['✏️','終極默寫'],review:['💪','錯題複習']};
const $=id=>document.getElementById(id), storage=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},load=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}};
let lesson=0,mode='listen',idx=0,points=0,selected=[],used=[],answered=false,hadError=false,available=false,voiceSeq=0,missed=load('spelling-missed-v2'),stats=load('spelling-stats-v2'),missingCount=1,hiddenPositions=[],tiles=[],pending=false;
const words=()=>LESSONS[lesson].words.flatMap(w=>w.variants||[w]),key=w=>lesson+':'+w.en;
const pool=()=>mode==='review'?words().filter(w=>missed[key(w)]):mode==='picture'?words().filter(w=>IMAGE[w.en]):words();
const word=()=>pool().length?pool()[idx%pool().length]:null;
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function say(after){const w=word();if(!w){after?.();return}const id=++voiceSeq;pending=true;lock(true);$('playline').textContent='🔊 請聽發音…';let fired=false;const done=()=>{if(fired||id!==voiceSeq)return;fired=true;pending=false;lock(false);$('playline').textContent='🎯 聽完了，開始挑戰！';after?.()};if(!('speechSynthesis'in window)){done();$('playline').textContent='🔇 此瀏覽器無法朗讀';return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.en);u.lang='en-US';u.rate=.76;u.pitch=1.05;u.onend=done;u.onerror=done;speechSynthesis.speak(u);setTimeout(done,3500)}catch(e){done()}}
function lock(disabled){$('check').disabled=disabled||answered||!word();$('next').disabled=disabled;$('clear').disabled=disabled||answered;document.querySelectorAll('.tile,.option').forEach(b=>b.disabled=disabled||answered||(b.dataset.used==='yes'))}
function record(ok){const w=word();if(!w)return;const k=key(w);stats[k] ||= {right:0,wrong:0};stats[k][ok?'right':'wrong']++;if(!ok)missed[k]=true;else if(mode==='review')delete missed[k];storage('spelling-missed-v2',missed);storage('spelling-stats-v2',stats)}
function resetUi(){for(const id of ['cue','slots','tiles','answers','feedback'])$(id).replaceChildren();$('entry').value='';$('entry').classList.add('hidden');$('feedback').className='feedback';answered=false;hadError=false;selected=[];used=[];pending=false}
function slots(target,reveal=[]){$('slots').replaceChildren();[...target].forEach((c,i)=>{const d=document.createElement('div');d.className='slot';d.textContent=reveal[i]===undefined?'':reveal[i];$('slots').append(d)})}
function makeTiles(chars,onsel){$('tiles').replaceChildren();tiles=shuffle(chars.map((ch,i)=>({ch,i})));tiles.forEach((t,i)=>{const b=document.createElement('button');b.className='tile';b.textContent=t.ch;b.disabled=pending;b.onclick=()=>{if(answered||pending||used.includes(i))return;used.push(i);selected.push(t.ch);b.dataset.used='yes';b.disabled=true;onsel()};$('tiles').append(b)})}
function render(){voiceSeq++;if('speechSynthesis'in window)speechSynthesis.cancel();resetUi();const p=pool(),w=word();$('counter').textContent=p.length?'第 '+(idx%p.length+1)+' / '+p.length+' 題':'本課已完成！';$('bar').style.width=p.length?100*((idx%p.length+1)/p.length)+'%':'100%';$('points').textContent='⭐ '+points;$('heading').textContent=MODES[mode][0]+' '+MODES[mode][1];$('mascot').textContent=['🦊','🐻','🐼','🐸','🐧','🦁'][idx%6];$('hint').textContent='';$('next').textContent='➡ 下一題';$('clear').classList.toggle('hidden',mode==='listen');$('check').classList.remove('hidden');$('check').disabled=true;$('next').disabled=true;
if(!w){$('cue').textContent='🏆';$('hint').textContent=mode==='review'?'沒有待複習錯題，太棒了！':'此關尚無可用圖片單字';$('playline').textContent='🎉 完成挑戰';$('check').classList.add('hidden');$('next').disabled=false;return}
const letters=[...w.en];
if(mode==='listen'){const choices=shuffle([w.en,...shuffle(words().filter(x=>x.en!==w.en)).slice(0,3).map(x=>x.en)]);$('cue').textContent='❓';$('hint').textContent='聽發音，選出正確的英文單字';choices.forEach(ch=>{const b=document.createElement('button');b.className='option';b.textContent=ch;b.onclick=()=>{if(!pending&&!answered){selected=[ch];check()}};$('answers').append(b)});$('check').classList.add('hidden')}
if(mode==='tiles'){ $('cue').textContent=w.zh;$('hint').textContent='聽發音後，按順序選字母';slots(w.en);makeTiles(letters,()=>slots(w.en,selected))}
if(mode==='missing'){missingCount=Math.min(letters.length,1+Math.floor(idx/Math.max(1,Math.ceil(p.length/3))));hiddenPositions=shuffle(letters.map((_,i)=>i)).slice(0,missingCount);$('cue').textContent=w.zh;$('hint').textContent='聽發音，補回消失的字母';slots(w.en,letters.map((c,i)=>hiddenPositions.includes(i)?'＿':c));makeTiles(hiddenPositions.map(i=>letters[i]),()=>{const a=[...letters];hiddenPositions.forEach((i,j)=>a[i]=selected[j]||'＿');slots(w.en,a)})}
if(mode==='picture'){ $('cue').textContent=IMAGE[w.en];$('cue').classList.add('emoji');$('hint').textContent='看圖片、聽發音，再用字母鍵盤拼字';slots(w.en);makeTiles(letters,()=>slots(w.en,selected))}
else $('cue').classList.remove('emoji');
if(mode==='dictation'||mode==='review'){$('cue').textContent=w.zh;$('hint').textContent='先聽單字，再完全靠自己寫出來（注意大小寫）';$('entry').classList.remove('hidden')}
if(mode==='review'){$('hint').textContent='🔁 曾答錯的單字：聽發音後重新默寫'}
$('playline').textContent='🔊 準備播放…';setTimeout(()=>{if(w===word())say()},160)}
function check(){const w=word();if(!w||answered||pending)return;let ans=(mode==='dictation'||mode==='review')?$('entry').value.trim():selected.join('');const ok=ans===w.en;if(!ok){hadError=true;record(false);$('feedback').textContent='💡 還差一點！再試一次';$('feedback').className='feedback bad';if(mode==='listen'){$('feedback').textContent='💡 再聽一遍，換個答案試試！';say()}return}answered=true;if(!hadError){record(true);points+=10}else if(mode==='review'){delete missed[key(w)];storage('spelling-missed-v2',missed)}$('points').textContent='⭐ '+points;$('feedback').textContent='🎉 太厲害了！ '+w.en+' ✓';$('feedback').className='feedback good';$('next').disabled=false;$('check').disabled=true;lock(false);$('next').focus()}
function next(){idx=(idx+1)%Math.max(1,pool().length);render()}
$('lesson').innerHTML=LESSONS.map((l,i)=>'<option value="'+i+'">'+l.title+'</option>').join('');$('lesson').onchange=e=>{lesson=Number(e.target.value);idx=0;render()};$('modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;idx=0;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));render()};$('speak').onclick=()=>say();$('next').onclick=next;$('check').onclick=check;$('clear').onclick=()=>{if(pending)return;selected=[];used=[];$('entry').value='';$('feedback').textContent='';render()};$('entry').onkeydown=e=>{if(e.key==='Enter')check()};$('start').onclick=()=>{$('gate').classList.add('hidden');available=true;render()};
</script></body></html>

<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#f4f8ff"><title>英文單字拼寫闖關</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#18263c;background:#eef5ff}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:15px;padding:12px 18px;background:#2764d9;color:white;font-weight:750;min-height:50px}button.secondary{background:#e4edff;color:#20477f}button:disabled{opacity:.35;cursor:not-allowed}.app{width:min(1100px,100%);height:100dvh;min-height:500px;margin:auto;display:flex;flex-direction:column;gap:12px;padding:clamp(10px,2vh,22px)}header{display:flex;align-items:center;gap:12px;justify-content:space-between}header h1{font-size:clamp(18px,3vw,30px);margin:0}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}select{background:white;border:2px solid #d7e5fa;border-radius:12px;padding:10px;color:#18263c}main{flex:1;display:flex;flex-direction:column;min-height:0;gap:12px}.tabs{display:flex;gap:8px;overflow-x:auto;flex-shrink:0}.tabs button{flex:1;white-space:nowrap;background:#dbe7fb;color:#244c81;font-size:clamp(13px,1.6vw,17px);padding:9px}.tabs button.active{background:#2764d9;color:white}.panel{background:#fff;border-radius:24px;flex:1;min-height:0;box-shadow:0 5px 22px #2c54801a;padding:clamp(12px,2.6vw,26px);display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:8px}.meta{align-self:stretch;display:flex;justify-content:space-between;align-items:center;font-size:clamp(13px,2vw,17px);color:#507098}.prompt{font-size:clamp(24px,5vw,48px);font-weight:850;text-align:center;line-height:1.25}.explain{text-align:center;color:#60738f;font-size:clamp(13px,2vw,17px)}.letters{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:100%}.slot{width:clamp(32px,6vw,60px);height:clamp(45px,8vh,76px);display:grid;place-items:center;border-bottom:4px solid #a6bcdc;font-size:clamp(23px,4vw,43px);font-weight:800}.slot.hint{color:#2764d9}.tile{min-width:clamp(40px,6vw,60px);padding:9px 12px;font-size:clamp(21px,3vw,30px);background:#e9f0ff;color:#244a88;box-shadow:0 3px 0 #b5c9ed}.tile:disabled{opacity:.3}.entry{width:min(480px,92%);height:68px;font-size:clamp(24px,4vw,35px);font-weight:800;text-align:center;letter-spacing:3px;border:3px solid #c8d8f4;border-radius:18px;outline-color:#2764d9}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.feedback{min-height:28px;font-size:clamp(15px,2.4vw,21px);font-weight:700;text-align:center}.good{color:#138052}.bad{color:#be4b38}.small{font-size:13px;color:#60738f;text-align:center}.lessonlist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;overflow-y:auto;width:100%;padding:4px}.wordcard{background:#f3f7ff;border:2px solid #e2ebfb;border-radius:15px;padding:12px 4px;text-align:center}.wordcard strong{display:block;font-size:clamp(16px,2.5vw,26px)}.wordcard span{font-size:clamp(12px,1.8vw,17px)}footer{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:6px;color:#60738f;font-size:12px}.mode-choice{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.pill{border-radius:99px;background:#edf3ff;color:#355b90;padding:5px 12px;font-size:13px}.hide{display:none!important}@media(max-width:530px){.app{min-height:540px}.lessonlist{grid-template-columns:repeat(2,minmax(0,1fr))}button{padding:9px 11px;min-height:45px}.tabs button{font-size:12px}.toolbar select{font-size:12px;max-width:130px}.prompt{font-size:clamp(23px,7vw,36px)}}@media(max-height:650px){.app{gap:6px;padding:8px}.panel{gap:2px}.slot{height:42px}.entry{height:48px}.prompt{font-size:25px}button{min-height:38px;padding:6px 12px}}
</style></head><body><div class="app"><header><h1>📚 單字拼寫闖關</h1><div class="toolbar"><select id="lesson" aria-label="選擇課次"></select><button class="secondary" id="speak">🔊 發音</button></div></header><main><nav class="tabs" id="tabs"><button data-mode="study" class="active">👀 認識</button><button data-mode="tiles">🧩 排字</button><button data-mode="missing">🔎 補字</button><button data-mode="write">✏️ 默寫</button><button data-mode="review">🔁 錯題</button></nav><section class="panel"><div class="meta"><span id="counter"></span><span id="score"></span></div><div class="prompt" id="prompt"></div><div class="explain" id="description"></div><div class="letters" id="slots"></div><div class="letters" id="tiles"></div><input class="entry hide" id="entry" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="拼寫英文單字" placeholder="輸入完整英文"/><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="secondary" id="clear">清除／重試</button><button id="check">檢查答案</button><button class="secondary" id="next">下一題 ➜</button></div><div class="lessonlist hide" id="wordlist"></div></section></main><footer><span>單字資料：3 課 × 每課 8 組｜Miss / miss 同組</span><span>本機儲存作答紀錄・可離線開啟</span></footer></div><script>
/* 新增單字時，只要新增一組 LESSONS 物件即可。每課 8 組；同組可設 variants。 */
const LESSONS=[
{title:'第 1 課',words:[{en:'one',zh:'一'},{en:'meet',zh:'認識；相遇'},{en:'class',zh:'班級'},{en:'here',zh:'這裡'},{en:'red',zh:'紅色'},{en:'pen',zh:'筆'},{en:'English',zh:'英語'},{en:'teacher',zh:'老師'}]},
{title:'第 2 課',words:[{en:'two',zh:'二'},{en:'blue',zh:'藍色'},{en:'book',zh:'書'},{en:'green',zh:'綠色'},{en:'pink',zh:'粉紅色'},{en:'purple',zh:'紫色'},{en:'pencil',zh:'鉛筆'},{variants:[{en:'Miss',zh:'小姐（稱謂）'},{en:'miss',zh:'想念'}]}]},
{title:'第 3 課',words:[{en:'three',zh:'三'},{en:'cap',zh:'棒球帽'},{en:'come',zh:'來'},{en:'his',zh:'他的'},{en:'please',zh:'請'},{en:'yes',zh:'是的'},{en:'this',zh:'這'},{en:'whose',zh:'誰的'}]}
];
const $=id=>document.getElementById(id);let lesson=0,mode='study',idx=0,chosen=[],used=[],missingIndex=0,attempted=false,missed=JSON.parse(localStorage.getItem('spelling-missed-v1')||'{}'),stats=JSON.parse(localStorage.getItem('spelling-stats-v1')||'{}');
const list=()=>LESSONS[lesson].words.flatMap(w=>w.variants||[w]);
const pool=()=>mode==='review'?list().filter(w=>missed[lesson+':'+w.en]):list();
const item=()=>pool()[idx%pool().length];
const shuffle=(arr)=>arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const speak=()=>{const w=item();if(!w)return; if(!('speechSynthesis' in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.en);u.lang='en-US';u.rate=.75;speechSynthesis.speak(u)};
function setMode(m){mode=m;idx=0; $('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));render()}
function next(){idx=(idx+1)%Math.max(1,pool().length);render()}
function record(ok){const w=item(),key=lesson+':'+w.en;if(!w)return;stats[key] ||= {right:0,wrong:0};stats[key][ok?'right':'wrong']++;if(!ok)missed[key]=true;else if(mode==='review')delete missed[key];localStorage.setItem('spelling-stats-v1',JSON.stringify(stats));localStorage.setItem('spelling-missed-v1',JSON.stringify(missed))}
function check(){const w=item();if(!w||mode==='study')return;let ans= mode==='tiles'?chosen.join(''):mode==='missing'?$('entry').value.trim():$('entry').value.trim();const ok=ans===w.en;const fb=$('feedback');fb.textContent=ok?'🎉 太棒了！拼字正確！':'再試一次！看看字母與大小寫是否正確。';fb.className='feedback '+(ok?'good':'bad');if(!attempted){record(ok);attempted=true}if(ok){$('next').focus()}}
function drawSlots(w){$('slots').innerHTML='';const answer=mode==='tiles'?chosen:[];[...w.en].forEach((letter,i)=>{const d=document.createElement('div');d.className='slot';if(mode==='tiles'){d.textContent=answer[i]||' ';d.onclick=()=>{if(chosen[i]!==undefined){chosen.splice(i,1);used.splice(i,1);drawSlots(w);drawTiles(w)}}}else if(mode==='missing'){d.textContent=i===missingIndex?'_':letter;d.classList.add('hint')} $('slots').append(d)})}
function drawTiles(w){$('tiles').innerHTML='';const letters=window.currentTiles||[];letters.forEach((letter,i)=>{const b=document.createElement('button');b.className='tile';b.textContent=letter;b.disabled=used.includes(i);b.onclick=()=>{chosen.push(letter);used.push(i);drawSlots(w);drawTiles(w)};$('tiles').append(b)})}
function render(){chosen=[];used=[];attempted=false;$('feedback').textContent='';$('entry').value='';$('slots').innerHTML='';$('tiles').innerHTML='';$('wordlist').innerHTML='';$('wordlist').classList.toggle('hide',mode!=='study');$('entry').classList.toggle('hide',!['missing','write','review'].includes(mode));$('clear').classList.toggle('hide',mode==='study');$('check').classList.toggle('hide',mode==='study');let words=pool(),w=item();$('counter').textContent=words.length?'第 '+(idx%words.length+1)+' / '+words.length+' 題':'沒有待複習的錯題';$('score').textContent='本課 '+LESSONS[lesson].words.length+' 組單字';if(!w){$('prompt').textContent='🎉 全部完成！';$('description').textContent='目前沒有錯題。可以切換其他關卡繼續練習。';return}$('prompt').textContent=mode==='study'?w.en:w.zh;let desc={study:'先聽單字發音，再觀察字母順序',tiles:'依照中文意思，點選字母排列成英文',missing:'觀察提示，輸入完整英文單字',write:'不看提示，自己拼出完整英文',review:'練習曾經答錯的單字；正確後移出錯題'};$('description').textContent=desc[mode];if(mode==='study'){for(let word of list()){let div=document.createElement('div');div.className='wordcard';div.innerHTML='<strong></strong><span></span>';div.querySelector('strong').textContent=word.en;div.querySelector('span').textContent=word.zh;div.onclick=()=>{let all=list();idx=all.findIndex(x=>x.en===word.en);render();speak()};$('wordlist').append(div)}}if(mode==='tiles'){window.currentTiles=shuffle([...w.en]);drawSlots(w);drawTiles(w)}if(mode==='missing'){missingIndex=Math.floor(Math.random()*w.en.length);drawSlots(w)}if(['missing','write','review'].includes(mode))$('entry').placeholder=mode==='missing'?'輸入完整英文單字':'輸入英文單字（大小寫正確）';$('next').disabled=false}
$('lesson').innerHTML=LESSONS.map((l,i)=>'<option value="'+i+'">'+l.title+'</option>').join('');$('lesson').onchange=e=>{lesson=+e.target.value;idx=0;render()};$('tabs').onclick=e=>{const b=e.target.closest('button[data-mode]');if(b)setMode(b.dataset.mode)};$('speak').onclick=speak;$('check').onclick=check;$('next').onclick=next;$('clear').onclick=()=>{chosen=[];used=[];attempted=false;$('entry').value='';$('feedback').textContent='';if(item()&&mode==='tiles'){drawSlots(item());drawTiles(item())} $('entry').focus()};$('entry').addEventListener('keydown',e=>{if(e.key==='Enter')check()});render();
</script></body></html>

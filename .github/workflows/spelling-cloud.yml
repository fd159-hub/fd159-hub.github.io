name: Spelling cloud tests
on:
  pull_request:
    paths:
      - 'english-spelling/**'
      - '.github/workflows/spelling-cloud.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: english-spelling/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: english-spelling/cloud/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - run: npm run migrate:local
      - run: npm run migrate:local
